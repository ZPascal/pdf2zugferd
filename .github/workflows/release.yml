name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Check tag matches package version
        run: |
          VERSION="$(uv version --short)"
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME != version v$VERSION"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  binaries:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Build single-file binary
        run: >
          uv run pyinstaller --onefile --name pdf-to-zugpferd-${{ runner.os }}
          --collect-data drafthorse --collect-data pdfminer
          --noconfirm packaging_entry.py
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ runner.os }}
          path: dist/pdf-to-zugpferd*

  publish-pypi:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
